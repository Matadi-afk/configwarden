# =============================================================================
# Publication sur PyPI : se déclenche quand une release GitHub est publiée.
#
# Sécurité appliquée ici :
#  - Trusted Publishing (OIDC) : AUCUN jeton PyPI n'est stocké, ni ici ni dans GitHub ;
#  - le droit « id-token: write » n'existe que dans le job qui publie, lui-même
#    protégé par l'environnement GitHub « pypi » (approbation manuelle possible) ;
#  - le paquet est construit dans un job séparé, sans aucun droit particulier ;
#  - actions figées par leur empreinte SHA, outil de construction figé par version ;
#  - la version du paquet doit correspondre à l'étiquette de la release (v0.3.0 = 0.3.0) ;
#  - des attestations numériques (PEP 740) sont générées et publiées automatiquement.
# =============================================================================
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Construire le paquet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Vérifier que la version correspond à l'étiquette de la release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Version du paquet ($version) différente de l'étiquette ($TAG)."
            exit 1
          fi

      - name: Construire la roue et l'archive source
        run: |
          python -m pip install build==1.6.1
          python -m build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publier sur PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/configwarden
    permissions:
      id-token: write # obligatoire pour Trusted Publishing, et seulement ici
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
